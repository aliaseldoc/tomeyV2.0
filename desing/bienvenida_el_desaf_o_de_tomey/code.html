        </p>

<div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-teal-medical to-gold-accent"></div>

<div class="relative group">
<label class="sr-only" for="playerName">Ingresa tu nombre</label>
<div class="absolute inset-y-0 left-0 flex items-center pl-sm pointer-events-none text-primary">
