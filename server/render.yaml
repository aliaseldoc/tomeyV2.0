services:
  - type: web
    name: tomey-ranking-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: tomey-ranking-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/ranking.sqlite
      - key: FRONTEND_ORIGIN
        sync: false
